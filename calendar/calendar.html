<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Javascript Calendar</title>

<link rel="stylesheet" media="screen, print, handheld" type="text/css" href="calendar.css" />
<link href="fullcalendar/dist/fullcalendar.min.css" rel="stylesheet" />
<link href="fullcalendar/dist/fullcalendar.print.css" rel="stylesheet" media="print" />
<script src="fullcalendar/lib/moment.min.js"></script>
<script src="fullcalendar/lib/jquery.min.js"></script>
<script src="calendar.js"></script>
<script src="fullcalendar/dist/fullcalendar.min.js"></script>
</head>
<body>
<h1>My Calendar</h1>
<div id="modow"></div>
<div id="openmod" data-toggle="modal" data-target="#visitmod"></div> 
<div id="fc_create" data-toggle="modal" data-target="#CalenderModalNew"></div> 
<script type="text/javascript">
  //calendar();
$(document).ready(function() {
 $('#calendar').fullCalendar({
			defaultDate: '2017-09-25',
			editable: true,
			eventLimit: true, // allow "more" link when too many events
			events: [
				
				{
					title: 'Click for Google',
					url: 'http://google.com/',
					start: '2017-09-28'
				}
			]
		});
		
	});
			   
 </script>
</body>
</html>
